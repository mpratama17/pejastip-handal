# Supabase free tier di-pause setelah 1 minggu tanpa aktivitas (docs/05 §6).
# Query ringan tiap 3 hari sekaligus uptime check: gagal = workflow merah =
# email notifikasi dari GitHub. Cron GitHub bisa telat/skip — cek manual
# bulanan tetap jalan (docs/05 §7).
name: keep-alive

on:
  schedule:
    - cron: "23 1 */3 * *" # 08:23 WIB tiap 3 hari
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query database lewat REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" || { echo "::error::Secret SUPABASE_URL / SUPABASE_ANON_KEY belum diisi"; exit 1; }
          # events dibaca publik (RLS) → menyentuh Postgres, bukan cuma gateway.
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1"
